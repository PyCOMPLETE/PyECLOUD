[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "numpy>=1.26", "Cython>=3", "meson>=1.2", "ninja"]

[project]
name = "PyECLOUD"
dynamic = ["version"]
description = "Electron cloud simulations for particle accelerators"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "scipy", "matplotlib", "pypic-poisson>=2.5.0", "pyklu>=0.2.0", "h5py"]

[project.urls]
"Source Code" = "https://github.com/PyCOMPLETE/PyECLOUD"
"Documentation" = "https://github.com/PyCOMPLETE/PyECLOUD/wiki"

[project.optional-dependencies]
tests = ["pytest", "seaborn","nafflib","mpi4py","PyHEADTAIL"]
tracking = ["PyHEADTAIL","nafflib"]

[tool.setuptools]
include-package-data = false
py-modules = []

[tool.setuptools.packages.find]
include = ["PyECLOUD*", "PyPARIS*", "PyPARIS_sim_class*", "PyPARIS_CoupledBunch_sim_class*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "PyECLOUD._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
