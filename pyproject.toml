[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "numpy>=1.26", "Cython>=3", "meson>=1.2", "ninja"]

[project]
name = "PyECLOUD"
dynamic = ["version"]
description = "Electron cloud simulations for particle accelerators"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "scipy", "matplotlib", "PyPIC>=2.4.5"]

[project.urls]
"Source Code" = "https://github.com/PyCOMPLETE/PyECLOUD"
"Documentation" = "https://github.com/PyCOMPLETE/PyECLOUD/wiki"

[project.optional-dependencies]
tests = ["pytest"]
pyheadtail = ["PyHEADTAIL", "h5py"]
hdf5 = ["h5py"]

[tool.setuptools]
include-package-data = false
py-modules = []

[tool.setuptools.packages.find]
include = ["PyECLOUD*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "PyECLOUD._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
